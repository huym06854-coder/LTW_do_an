<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chuyển kho | TechStore</title><link rel="stylesheet" th:href="@{/store/css/workspace.css}"></head>
<body class="admin-body ops-page"><a class="ops-skip" href="#workspaceMain">Đến nội dung chính</a>
<div th:replace="~{admin/fragments/admin-layout :: sidebar('transfers')}"></div>
<main class="admin-main" id="workspaceMain"><div th:replace="~{admin/fragments/admin-layout :: topbar}"></div><div class="page-wrap"><header class="ops-heading"><div><span class="ops-eyebrow">Điều phối hàng hóa</span><h1>Quản lý chuyển kho</h1><p>Duyệt yêu cầu và theo dõi hàng luân chuyển giữa các chi nhánh.</p></div></header><div th:replace="~{fragments/workspace :: alerts}"></div><div class="ops-flow" aria-label="Quy trình chuyển kho"><span>01 · Chờ duyệt</span><b>→</b><span>02 · Đã duyệt</span><b>→</b><span>03 · Đang chuyển</span><b>→</b><span>04 · Đã nhận hàng</span></div>
<section class="ops-panel"><div class="ops-panel-head"><div><h2>Tất cả phiếu chuyển kho</h2><p>Duyệt phiếu để trừ kho nguồn. Chi nhánh nhận xác nhận khi hàng đến.</p></div><span class="ops-badge" th:text="${transfers.size() + ' phiếu'}"></span></div>
<div th:replace="~{fragments/workspace :: transferTable(${transfers}, false)}"></div></section></div></main>
<script th:src="@{/store/js/workspace.js}" defer></script></body></html>
