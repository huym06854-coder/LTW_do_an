<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý chuyển kho</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/admin/css/admin-pages.css}">
</head>

<body class="admin-body">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('transfers')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments/admin-layout :: topbar}"></div>
        <div class="page-wrap">
    <div class="admin-wrap">
    <header class="mb-4"><h1>Duyệt chuyển kho</h1></header>
    <table class="table">
        <tr>
            <th>Mã</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        <tr th:each="t : ${transfers}">
            <td th:text="${t.code}"></td>
            <td th:text="${t.status}"></td>
            <td>
                <form method="post" th:if="${t.status.name() == 'PENDING'}"
                    th:action="@{/admin/transfers/{id}/approve(id=${t.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button
                        class="btn btn-primary">Duyệt (trừ kho nguồn)</button>
                </form>
                <form method="post"
                    th:if="${t.status.name() != 'COMPLETED' and t.status.name() != 'CANCELLED' and t.status.name() != 'IN_TRANSIT'}"
                    th:action="@{/admin/transfers/{id}/cancel(id=${t.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button
                        class="btn btn-danger">Hủy</button>
                </form>
            </td>
        </tr>
    </table>
    </div>
        </div>
    </main>
</body>

</html>
