<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đánh giá | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/admin-pages.css}">
    <link rel="stylesheet" th:href="@{/store/css/workspace.css}">
</head>

<body class="admin-body ops-page">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('reviews')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments/admin-layout :: topbar}"></div>
        <div class="page-wrap">
    <div class="admin-wrap">
        <header class="mb-4">
            <h1>Đánh giá</h1>
            <nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/products">Sản phẩm</a>
                <a href="/admin/categories">Danh mục</a><a href="/admin/brands">Thương hiệu</a><a
                    href="/admin/branches">Chi nhánh</a><a href="/admin/stock">Kho</a><a href="/admin/users">Người
                    dùng</a><a href="/admin/coupons">Mã giảm giá</a><a href="/admin/reviews">Đánh giá</a><a
                    href="/admin/reports">Doanh thu</a>
            </nav>
            <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Đăng xuất</button></form>
        </header>
        <table class="table bg-white">
            <tr th:each="r : ${reviews}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.rating}"></td>
                <td th:text="${r.comment}"></td>
                <td>
                    <form method="post" th:action="@{/admin/reviews/{id}/delete(id=${r.id})}"><input type="hidden"
                            th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button
                            class="btn btn-danger btn-sm">Xóa</button></form>
                </td>
            </tr>
        </table>
    </div>
        </div>
    </main>
</body>

</html>
