<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sản phẩm | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/admin-pages.css}">
</head>

<body class="admin-body">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('products')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments/admin-layout :: topbar}"></div>
        <div class="page-wrap">
    <div class="admin-wrap">
        <header class="mb-4">
            <h1>Sản phẩm</h1>
            <nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/products">Sản phẩm</a>
                <a href="/admin/categories">Danh mục</a><a href="/admin/brands">Thương hiệu</a><a
                    href="/admin/branches">Chi nhánh</a><a href="/admin/stock">Kho</a><a href="/admin/users">Người
                    dùng</a><a href="/admin/coupons">Mã giảm giá</a><a href="/admin/reviews">Đánh giá</a><a
                    href="/admin/reports">Doanh thu</a>
            </nav>
            <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Đăng xuất</button></form>
        </header>
        <form class="card p-3" method="post" th:action="@{/admin/products}"><input type="hidden"
                th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h5>Thêm sản phẩm</h5>
            <div class="row g-2">
                <div class="col"><input class="form-control" name="sku" placeholder="SKU" required></div>
                <div class="col"><input class="form-control" name="name" placeholder="Tên sản phẩm" required></div>
                <div class="col"><input class="form-control" name="price" type="number" min="0" placeholder="Giá"
                        required></div>
                <div class="col"><input class="form-control" name="categoryId" type="number" min="1"
                        placeholder="ID danh mục" required></div>
                <div class="col"><input class="form-control" name="brandId" type="number" min="1"
                        placeholder="ID thương hiệu (tùy chọn)"></div>
            </div><button class="btn btn-primary mt-2">Tạo sản phẩm</button>
        </form>
        <table class="table bg-white">
            <tr>
                <th>SKU</th>
                <th>Tên</th>
                <th>Giá</th>
                <th>Trạng thái</th>
                <th>Thay đổi</th>
            </tr>
            <tr th:each="p : ${products}">
                <td th:text="${p.sku}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.status}"></td>
                <td>
                    <form method="post" th:action="@{/admin/products/{id}/status(id=${p.id})}"><input type="hidden"
                            th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                            <option value="DISCONTINUED">DISCONTINUED</option>
                        </select>
                        <button class="btn btn-sm btn-primary">Cập nhật</button>
                    </form>
                    <form class="my-2" method="post" th:action="@{/admin/products/{id}/update(id=${p.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input name="name" th:value="${p.name}" class="form-control form-control-sm" required>
                        <input name="price" th:value="${p.price}" type="number" min="0"
                            class="form-control form-control-sm" required>
                        <button class="btn btn-sm btn-outline-primary">Sửa tên/giá</button>
                    </form>
                    <form class="mt-2" method="post" enctype="multipart/form-data"
                        th:action="@{/admin/products/{id}/image(id=${p.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="file" name="file" accept="image/png,image/jpeg,image/webp" required><button
                            class="btn btn-sm btn-outline-primary">Upload ảnh (≤5MB)</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
        </div>
    </main>
</body>

</html>
