<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kho hàng | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/admin-pages.css}">
</head>

<body class="admin-body">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('stock')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments/admin-layout :: topbar}"></div>
        <div class="page-wrap">
    <div class="admin-wrap">
        <header class="mb-4">
            <h1>Kho hàng</h1>
            <nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/products">Sản phẩm</a>
                <a href="/admin/categories">Danh mục</a><a href="/admin/brands">Thương hiệu</a><a
                    href="/admin/branches">Chi nhánh</a><a href="/admin/stock">Kho</a><a href="/admin/users">Người
                    dùng</a><a href="/admin/coupons">Mã giảm giá</a><a href="/admin/reviews">Đánh giá</a><a
                    href="/admin/reports">Doanh thu</a>
            </nav>
            <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Đăng xuất</button></form>
        </header>
        <form method="get" th:action="@{/admin/stock}"><select name="branchId" class="form-select">
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
            </select>
            <button class="btn btn-outline-primary my-2">Xem tồn kho</button>
        </form>
        <table class="table bg-white">
            <tr>
                <th>Chi nhánh</th>
                <th>Sản phẩm ID</th>
                <th>Số lượng</th>
            </tr>
            <tr th:each="s : ${stocks}">
                <td th:text="${s.branchId}"></td>
                <td th:text="${s.productId}"></td>
                <td th:text="${s.quantity}"></td>
            </tr>
        </table>
        <form method="post" class="card p-3" th:action="@{/admin/stock/update}"><input type="hidden"
                th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h5>Điều chỉnh tồn kho</h5>
            <label>ID chi nhánh<input type="number" name="branchId" min="1" required class="form-control"></label>
            <label>ID sản phẩm<input type="number" name="productId" min="1" required class="form-control"></label>
            <label>Thay đổi (+ nhập, - xuất)<input type="number" name="quantityChange" required
                    class="form-control"></label>
            <label>Lý do<textarea name="reason" required class="form-control"></textarea></label><button
                class="btn btn-primary mt-2">Cập nhật</button>
        </form>
    </div>
        </div>
    </main>
</body>

</html>
