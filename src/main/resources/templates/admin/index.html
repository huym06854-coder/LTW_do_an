<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản trị chuỗi cửa hàng | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/admin-pages.css}">
</head>

<body class="admin-body">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('overview')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments/admin-layout :: topbar}"></div>
        <div class="page-wrap">
    <div class="admin-wrap">
        <header class="mb-4">
            <h1>Quản trị chuỗi cửa hàng</h1>
            <nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/products">Sản phẩm</a>
                <a href="/admin/categories">Danh mục</a><a href="/admin/brands">Thương hiệu</a><a
                    href="/admin/branches">Chi nhánh</a><a href="/admin/stock">Kho</a><a href="/admin/users">Người
                    dùng</a><a href="/admin/coupons">Mã giảm giá</a><a href="/admin/reviews">Đánh giá</a><a
                    href="/admin/reports">Doanh thu</a><a href="/admin/transfers">Chuyển kho</a>
            </nav>
            <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Đăng xuất</button></form>
        </header>
        <section class="row g-3">
            <div class="col-6 col-lg-3">
                <div class="card p-4"><small>Người dùng</small>
                    <h2 th:text="${userCount}"></h2>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card p-4"><small>Sản phẩm</small>
                    <h2 th:text="${productCount}"></h2>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card p-4"><small>Đơn hàng</small>
                    <h2 th:text="${orderCount}"></h2>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card p-4"><small>Chi nhánh</small>
                    <h2 th:text="${branchCount}"></h2>
                </div>
            </div>
        </section>
        <p>Chỉ số hiển thị lấy từ SQL Server qua Repository (không sử dụng localStorage).</p>
    </div>
        </div>
    </main>
</body>

</html>
