<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mã ưu đãi | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/admin-pages.css}">
    <link rel="stylesheet" th:href="@{/store/css/workspace.css}">
</head>

<body class="admin-body ops-page">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('coupons')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments/admin-layout :: topbar}"></div>
        <div class="page-wrap">
    <div class="admin-wrap">
        <header class="mb-4">
            <h1>Mã ưu đãi</h1>
            <nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/products">Sản phẩm</a>
                <a href="/admin/categories">Danh mục</a><a href="/admin/brands">Thương hiệu</a><a
                    href="/admin/branches">Chi nhánh</a><a href="/admin/stock">Kho</a><a href="/admin/users">Người
                    dùng</a><a href="/admin/coupons">Mã giảm giá</a><a href="/admin/reviews">Đánh giá</a><a
                    href="/admin/reports">Doanh thu</a>
            </nav>
            <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Đăng xuất</button></form>
        </header>
        <form class="card p-3" method="post" th:action="@{/admin/coupons}"><input type="hidden"
                th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>Mã<input name="code" required class="form-control"></label><label>Loại<select name="discountType"
                    class="form-select">
                    <option value="FIXED_AMOUNT">Số tiền</option>
                    <option value="PERCENTAGE">Phần trăm</option>
                </select></label>
            <label>Giá trị<input type="number" min="1" name="discountValue" class="form-control"></label><label>Hạn
                đến<input type="datetime-local" name="expiresAt" class="form-control"></label>
            <button class="btn btn-primary mt-2">Tạo mã</button>
        </form>
        <ul class="list-group">
            <li class="list-group-item" th:each="c : ${coupons}" th:text="${c.code}"></li>
        </ul>
    </div>
        </div>
    </main>
</body>

</html>
