<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chi nhánh | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/admin-pages.css}">
</head>

<body class="admin-body">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('branches')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments/admin-layout :: topbar}"></div>
        <div class="page-wrap">
    <div class="admin-wrap">
        <header class="mb-4">
            <h1>Chi nhánh</h1>
            <nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/products">Sản phẩm</a>
                <a href="/admin/categories">Danh mục</a><a href="/admin/brands">Thương hiệu</a><a
                    href="/admin/branches">Chi nhánh</a><a href="/admin/stock">Kho</a><a href="/admin/users">Người
                    dùng</a><a href="/admin/coupons">Mã giảm giá</a><a href="/admin/reviews">Đánh giá</a><a
                    href="/admin/reports">Doanh thu</a>
            </nav>
            <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Đăng xuất</button></form>
        </header>
        <form method="post" class="card p-3" th:action="@{/admin/branches}"><input type="hidden"
                th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row g-2">
                <div class="col"><input name="code" class="form-control" placeholder="Mã chi nhánh" required></div>
                <div class="col"><input name="name" class="form-control" placeholder="Tên" required></div>
                <div class="col"><input name="address" class="form-control" placeholder="Địa chỉ" required></div>
            </div><button class="btn btn-primary mt-2">Thêm chi nhánh</button>
        </form>
        <table class="table bg-white">
            <tr th:each="b : ${branches}">
                <td th:text="${b.id}"></td>
                <td th:text="${b.code}"></td>
                <td th:text="${b.name}"></td>
                <td th:text="${b.address}"></td>
            </tr>
        </table>
    </div>
        </div>
    </main>
</body>

</html>
