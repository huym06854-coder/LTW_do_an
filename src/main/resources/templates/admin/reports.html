<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Doanh thu | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/admin-pages.css}">
</head>

<body class="admin-body">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('reports')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments/admin-layout :: topbar}"></div>
        <div class="page-wrap">
    <div class="admin-wrap">
        <header class="mb-4">
            <h1>Doanh thu</h1>
            <nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/products">Sản phẩm</a>
                <a href="/admin/categories">Danh mục</a><a href="/admin/brands">Thương hiệu</a><a
                    href="/admin/branches">Chi nhánh</a><a href="/admin/stock">Kho</a><a href="/admin/users">Người
                    dùng</a><a href="/admin/coupons">Mã giảm giá</a><a href="/admin/reviews">Đánh giá</a><a
                    href="/admin/reports">Doanh thu</a>
            </nav>
            <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Đăng xuất</button></form>
        </header>
        <div class="card p-4">
            <h2>Doanh thu các đơn COMPLETED trong 30 ngày</h2>
            <strong class="display-6" th:text="${total}"></strong> ₫
        </div>
        <p>Doanh thu tính theo completed_at, không phải ngày tạo đơn.</p>
    </div>
        </div>
    </main>
</body>

</html>
