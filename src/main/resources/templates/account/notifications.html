<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo | TechStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/store/css/style.css}">
    <link rel="stylesheet" th:href="@{/store/css/site.css}">
</head>

<body>
    <div th:replace="~{fragments/store-layout :: siteHeader}"></div>
    <main class="container tech-main">
        <h1>Thông báo</h1>
        <div class="card p-3 my-2" th:each="n : ${notifications}"><b th:text="${n.title}"></b>
            <p th:text="${n.message}"></p>
            <form method="post" th:if="${n.readAt == null}" th:action="@{/notifications/{id}/read(id=${n.id})}"><input
                    type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button
                    class="btn btn-sm btn-outline-primary">Đã đọc</button></form>
        </div>
    </main>
    <div th:replace="~{fragments/store-layout :: siteFooter}"></div>
</body>

</html>
