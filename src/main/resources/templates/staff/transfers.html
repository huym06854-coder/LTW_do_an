<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Chuyển kho</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="container py-5"><a th:href="@{/staff/orders}">← Đơn chi nhánh</a>
    <h1>Yêu cầu chuyển kho</h1>
    <form method="post" class="card p-3" th:action="@{/staff/transfers}"><input type="hidden"
            th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Chi nhánh nhận<select name="destinationBranchId" class="form-select">
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
            </select></label>
        <label>Product ID<input name="productId" type="number" min="1" required class="form-control"></label>
        <label>Số lượng<input name="quantity" type="number" min="1" required class="form-control"></label>
        <button class="btn btn-primary my-2">Gửi yêu cầu</button>
    </form>
    <table class="table">
        <tr>
            <th>Mã</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        <tr th:each="t : ${transfers}">
            <td th:text="${t.code}"></td>
            <td th:text="${t.status}"></td>
            <td>
                <form method="post" th:if="${t.status.name() == 'APPROVED'}"
                    th:action="@{/staff/transfers/{id}/ship(id=${t.id})}"><input type="hidden"
                        th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button
                        class="btn btn-outline-primary">Đã xuất hàng</button></form>
                <form method="post" th:if="${t.status.name() == 'IN_TRANSIT'}"
                    th:action="@{/staff/transfers/{id}/complete(id=${t.id})}"><input type="hidden"
                        th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-success">Nhận
                        hàng</button></form>
            </td>
        </tr>
    </table>
</body>

</html>
