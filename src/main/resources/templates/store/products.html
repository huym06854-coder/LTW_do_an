<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Khám phá sản phẩm | TechDemo</title>
    <link rel="stylesheet" th:href="@{/store/css/style.css}">
    <link rel="stylesheet" th:href="@{/store/css/site.css}">
</head>

<body class="products-page">
    <div th:replace="~{fragments/store-layout :: siteHeader}"></div>
    <main class="container wrap">
        <div class="breadcrumb"><a th:href="@{/}" href="/">Trang chủ</a>　›　Khám phá sản phẩm</div>
        <section class="page-intro"><small class="eyebrow-dark">TECH DEMO PRODUCT COLLECTION</small>
            <h1>Khám phá sản phẩm</h1>
            <p>Lựa chọn theo danh mục, thương hiệu và nhu cầu sử dụng.</p>
        </section>
        <section class="filter-panel">
            <div class="filter-title"><b>☷ Bộ lọc sản phẩm</b><button id="clearFilters">↻ Xóa bộ lọc</button></div>
            <div class="filter-grid"><label>Danh mục<select id="filterCategory">
                        <option value="">Tất cả</option>
                        <option>Laptop</option>
                        <option>PC</option>
                        <option>Màn hình</option>
                        <option>Phụ kiện</option>
                        <option>Camera</option>
                        <option>Mạng</option>
                    </select></label><label>Thương hiệu<select id="filterBrand">
                        <option value="">Tất cả</option>
                        <option>ASUS</option>
                        <option>Dell</option>
                        <option>Lenovo</option>
                        <option>HP</option>
                        <option>Acer</option>
                        <option>MSI</option>
                        <option>Tech Demo</option>
                    </select></label><label>Mục tiêu<select id="filterNeed">
                        <option value="">Tất cả</option>
                        <option>Văn phòng</option>
                        <option>Học tập</option>
                        <option>Gaming</option>
                        <option>Đồ họa</option>
                        <option>Sinh viên</option>
                    </select></label><label>CPU<select id="filterCpu">
                        <option value="">Tất cả</option>
                        <option>Intel Core i5</option>
                        <option>Intel Core i7</option>
                        <option>AMD Ryzen 5</option>
                        <option>AMD Ryzen 7</option>
                    </select></label><label>RAM<select id="filterRam">
                        <option value="">Tất cả</option>
                        <option>8GB</option>
                        <option>16GB</option>
                        <option>32GB</option>
                    </select></label><label>Ổ cứng SSD<select id="filterSsd">
                        <option value="">Tất cả</option>
                        <option>256GB</option>
                        <option>512GB</option>
                        <option>1TB</option>
                    </select></label><label>Mức giá<select id="filterPrice">
                        <option value="">Tất cả mức giá</option>
                        <option value="under10">Dưới 10 triệu</option>
                        <option value="10to20">10 - 20 triệu</option>
                        <option value="over20">Trên 20 triệu</option>
                    </select></label><label class="check-filter"><input type="checkbox" id="inStock"> Còn hàng
                    (demo)</label></div>
        </section>
        <section class="catalog-results">
            <div class="results-top">
                <div>
                    <h2>Sản phẩm nổi bật</h2><small id="resultCount">Hiển thị 10/10 sản phẩm</small>
                </div>
                <div class="sort-buttons"><button class="active" data-sort="popular">✦ Phổ biến</button><button
                        data-sort="discount">⊙ Giảm giá</button><button data-sort="price-asc">↗ Giá tăng
                        dần</button><button data-sort="price-desc">↘ Giá giảm dần</button></div>
            </div>
            <div class="product-grid catalog-grid" id="catalogProducts"></div>
            <div class="empty-state" id="emptyState" hidden>Không tìm thấy sản phẩm phù hợp. Hãy thử thay đổi bộ lọc.
            </div>
        </section>
    </main>
    <div th:replace="~{fragments/store-layout :: siteFooter}"></div>
</body>

</html>
