<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | TechStore</title>
    <link rel="stylesheet" th:href="@{/store/css/style.css}">
    <link rel="stylesheet" th:href="@{/store/css/site.css}">
</head>

<body class="login-page">
    <div th:replace="~{fragments/store-layout :: siteHeader}"></div>
    <main class="wrap">
        <div class="breadcrumb"><a th:href="@{/}" href="/">Trang chủ</a>　›　Đăng nhập</div>
        <section class="auth-wrap">
            <div class="auth-art">
                <div class="auth-logo">TD</div>
                <small>TECHSTORE • TECHNOLOGY STORE</small>
                <h1>Công nghệ tốt.<br><span>Trải nghiệm khác biệt.</span></h1>
                <p>Đăng nhập để tiếp tục trải nghiệm mua sắm tiện lợi.</p>
            </div>
            <form class="auth-form" method="post" th:action="@{/login}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <h1>Chào mừng trở lại!</h1>
                <p>Đăng nhập tài khoản TechStore</p>
                <div class="auth-message auth-message--error" role="alert" th:if="${param.error}">
                    Thông tin đăng nhập không chính xác hoặc tài khoản bị khóa.
                </div>
                <div class="auth-message" role="status" th:if="${message}" th:text="${message}"></div>
                <label>Email hoặc tên đăng nhập
                    <input name="login" type="text" autocomplete="username" placeholder="name@example.com" required>
                </label>
                <label>Mật khẩu
                    <input name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                </label>
                <button class="red-btn" type="submit">Đăng nhập →</button>
                <p class="auth-foot">Chưa có tài khoản? <a th:href="@{/register}" href="/register">Đăng ký ngay</a></p>
            </form>
        </section>
    </main>
    <div th:replace="~{fragments/store-layout :: siteFooter}"></div>
</body>

</html>
